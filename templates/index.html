<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f2f5;
      color: #2c3e50;
      min-height: 100vh;
    }

    header {
      background: #2c3e50;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo { color: #fff; font-size: 18px; font-weight: 700; }

    #last-updated { color: #7f8c8d; font-size: 11px; margin-left: 10px; white-space: nowrap; }

    .day-nav { display: flex; align-items: center; gap: 10px; }

    .day-nav button {
      background: #34495e;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 14px;
      cursor: pointer;
    }

    .day-nav button:hover { background: #4a6278; }

    #today-btn { background: #27ae60; }
    #today-btn:hover { background: #2ecc71; }

    #current-date { color: #fff; font-size: 15px; font-weight: 600; min-width: 200px; text-align: center; }

    main { max-width: 760px; margin: 0 auto; padding: 24px 16px; display: flex; flex-direction: column; gap: 28px; }

    .section-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #7f8c8d;
      margin-bottom: 10px;
    }

    .section-label.missing-label { color: #e67e22; }

    .card {
      background: #fff;
      border-radius: 8px;
      border: 1px solid #e0e0e0;
      display: flex;
      align-items: center;
      padding: 13px 16px;
      gap: 14px;
      margin-bottom: 8px;
    }

    .card.missing { border-color: #f39c12; }
    .card.not-submitted { border-color: #e74c3c; }

    .card-time { min-width: 72px; font-size: 13px; font-weight: 600; color: #7f8c8d; }

    .card-body { flex: 1; }

    .card-title { font-size: 14px; font-weight: 700; }

    .card-sub { font-size: 12px; color: #7f8c8d; margin-top: 2px; }

    .card-comment { font-size: 12px; color: #27ae60; font-style: italic; margin-top: 4px; }

    .card-right { text-align: right; white-space: nowrap; }

    .grade { font-size: 18px; font-weight: 700; color: #27ae60; }

    .status { font-size: 12px; font-weight: 600; }
    .status.submitted { color: #27ae60; }
    .status.pending { color: #f39c12; }
    .status.not-submitted { color: #e74c3c; }
    .status.missing { color: #e67e22; }

    .status-icon {
      width: 22px; height: 22px; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; color: #fff; flex-shrink: 0;
    }

    .status-icon.ok { background: #2ecc71; }
    .status-icon.warn { background: #e74c3c; }
    .status-icon.missing { background: #f39c12; }

    .zoom-btn {
      background: #3498db;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 7px 14px;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      white-space: nowrap;
    }

    .zoom-btn:hover { background: #2980b9; }

    .empty { color: #bdc3c7; font-size: 14px; padding: 12px 0; }

    #error-banner {
      background: #e74c3c;
      color: #fff;
      padding: 12px 16px;
      border-radius: 8px;
      display: none;
    }

    #loading { padding: 32px 0; display: none; text-align: center; }

    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #e0e0e0;
      border-top-color: #3498db;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 10px;
    }

    .spinner-label { color: #7f8c8d; font-size: 13px; }

    @keyframes spin { to { transform: rotate(360deg); } }

    #missing-section { display: none; }

    .card { position: relative; overflow: hidden; }

    .hide-btn {
      display: none;
      position: absolute;
      top: 6px; right: 8px;
      background: none;
      border: none;
      color: #bdc3c7;
      font-size: 15px;
      line-height: 1;
      padding: 2px 5px;
      border-radius: 4px;
      cursor: pointer;
    }
    .card:hover .hide-btn { display: block; }
    .hide-btn:hover { color: #7f8c8d; background: #f0f2f5; }

    .hide-opts {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(44,62,80,0.94);
      border-radius: 8px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px;
      flex-wrap: wrap;
    }
    .hide-opts.open { display: flex; }

    .hide-opts-btn {
      background: rgba(255,255,255,0.15);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 5px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .hide-opts-btn:hover { background: rgba(255,255,255,0.28); }

    .hide-opts-cancel {
      background: none;
      color: #aaa;
      border: none;
      font-size: 12px;
      cursor: pointer;
      padding: 6px 8px;
    }
    .hide-opts-cancel:hover { color: #fff; }

    .add-class-btn {
      background: none;
      border: 1px solid #bdc3c7;
      color: #7f8c8d;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      cursor: pointer;
      margin-left: 8px;
      vertical-align: middle;
    }
    .add-class-btn:hover { border-color: #3498db; color: #3498db; }

    .card.manual { border-color: #9b59b6; }
    .manual-badge {
      font-size: 10px;
      font-weight: 700;
      color: #9b59b6;
      letter-spacing: .5px;
      margin-top: 2px;
    }

    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
    }
    .modal {
      background: #fff;
      border-radius: 10px;
      padding: 24px;
      width: 360px;
      max-width: 95vw;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
    }
    .modal h3 { font-size: 16px; font-weight: 700; margin-bottom: 16px; }
    .modal label { display: block; font-size: 12px; font-weight: 600; color: #7f8c8d; margin-bottom: 10px; }
    .modal input[type=text], .modal input[type=url] {
      display: block; width: 100%;
      border: 1px solid #e0e0e0; border-radius: 5px;
      padding: 7px 10px; font-size: 13px; margin-top: 3px;
    }
    .day-checks { display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
    .day-checks label {
      display: flex; align-items: center; gap: 3px;
      font-size: 12px; font-weight: 600; color: #2c3e50;
      background: #f0f2f5; border-radius: 4px; padding: 4px 8px;
      cursor: pointer; margin-bottom: 0;
    }
    .day-checks input { margin: 0; }
    .modal-actions { display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end; }
    .modal-actions button { border-radius: 6px; padding: 7px 16px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .btn-primary { background: #3498db; color: #fff; border: none; }
    .btn-primary:hover { background: #2980b9; }
    .btn-cancel { background: none; border: 1px solid #e0e0e0; color: #7f8c8d; }
    .btn-cancel:hover { border-color: #bdc3c7; }

    .manual-entry-list { margin-top: 16px; border-top: 1px solid #f0f2f5; padding-top: 12px; }
    .manual-entry-row {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 12px; padding: 5px 0; border-bottom: 1px solid #f0f2f5;
    }
    .manual-entry-row:last-child { border-bottom: none; }
    .manual-entry-info { flex: 1; }
    .manual-entry-name { font-weight: 700; color: #2c3e50; }
    .manual-entry-meta { color: #7f8c8d; margin-top: 1px; }
    .remove-entry-btn {
      background: none; border: none; color: #e74c3c;
      font-size: 14px; cursor: pointer; padding: 2px 6px;
    }
    .remove-entry-btn:hover { color: #c0392b; }

    .task-course { margin: 14px 0 6px; font-weight: 600; color: #2c3e50; }
    .task-row { display: flex; align-items: center; gap: 10px; padding: 8px 12px;
                border: 1px solid #e5e8ec; border-radius: 8px; margin-bottom: 6px; background: #fff; }
    .task-row.optional { opacity: 0.55; }
    .task-row .t-title { flex: 1; }
    .task-row .t-title a { color: inherit; text-decoration: none; }
    .task-row .t-title a:hover { text-decoration: underline; }
    .task-tag { font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
                color: #7f8c8d; border: 1px solid #dfe4e8; border-radius: 6px; padding: 1px 6px; }
    .task-status { width: 18px; text-align: center; font-weight: 700; }
    .task-status.done { color: #27ae60; }
    .task-status.todo { color: #e74c3c; }
    .task-status.info { color: #bdc3c7; }
  </style>
</head>
<body>

<header>
  <div class="logo">📚 Canvas Dashboard<span id="last-updated"></span></div>
  <div class="day-nav">
    <button id="prev-day">◀</button>
    <span id="current-date"></span>
    <button id="next-day">▶</button>
    <button id="today-btn">Today</button>
  </div>
</header>

<main>
  <div id="error-banner"></div>
  <div id="loading"><div class="spinner"></div><div class="spinner-label">Loading…</div></div>

  <section id="schedule-section">
    <div class="section-label">📅 Today's Schedule <button class="add-class-btn" onclick="openAddClassModal()">+ Add class</button></div>
    <div id="schedule-list"></div>
  </section>

  <div id="add-class-modal" class="modal-overlay" style="display:none" onclick="closeAddClassModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <h3>Recurring Class</h3>
      <form id="add-class-form" onsubmit="submitAddClass(event)">
        <label>Class name
          <input type="text" id="ac-title" placeholder="5th Grade Core" required>
        </label>
        <label>Start time
          <input type="text" id="ac-time" placeholder="10:30 AM" required>
        </label>
        <label>Days
          <div class="day-checks">
            <label><input type="checkbox" name="day" value="Mon"> Mon</label>
            <label><input type="checkbox" name="day" value="Tue"> Tue</label>
            <label><input type="checkbox" name="day" value="Wed"> Wed</label>
            <label><input type="checkbox" name="day" value="Thu"> Thu</label>
            <label><input type="checkbox" name="day" value="Fri"> Fri</label>
          </div>
        </label>
        <label>Zoom / join URL (optional)
          <input type="url" id="ac-url" placeholder="https://zoom.us/j/...">
        </label>
        <div class="modal-actions">
          <button type="button" class="btn-cancel" onclick="closeAddClassModal()">Cancel</button>
          <button type="submit" class="btn-primary">Add</button>
        </div>
      </form>
      <div id="manual-entry-list" class="manual-entry-list" style="display:none"></div>
    </div>
  </div>

  <section id="assignments-section">
    <div class="section-label">📝 Assignments</div>
    <div id="assignments-list"></div>
  </section>

  <section id="tasks-section">
    <div class="section-label">📋 Today's Tasks</div>
    <div id="homepage-note" class="empty" style="display:none">Weekly homepage is only available for the current week.</div>
    <div id="tasks-list"></div>
  </section>

  <section id="missing-section">
    <div class="section-label missing-label">⚠ Missing Assignments</div>
    <div id="missing-list"></div>
  </section>
</main>

<script>
  function toDateStr(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
  }

  function esc(s) {
    return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function formatDisplayDate(dateStr) {
    const [y, m, d] = dateStr.split("-").map(Number);
    const dt = new Date(y, m - 1, d);
    return dt.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
  }

  function shiftDate(dateStr, days) {
    const [y, m, d] = dateStr.split("-").map(Number);
    const dt = new Date(y, m - 1, d + days);
    return toDateStr(dt);
  }

  function formatDueDate(isoStr) {
    if (!isoStr) return "";
    const dt = new Date(isoStr);
    return dt.toLocaleDateString("en-US", { month: "short", day: "numeric" });
  }

  function showError(msg) {
    const banner = document.getElementById("error-banner");
    banner.textContent = msg;
    banner.style.display = "block";
  }

  function hideError() {
    document.getElementById("error-banner").style.display = "none";
  }

  function renderSchedule(schedule) {
    const list = document.getElementById("schedule-list");
    if (!schedule.length) {
      list.innerHTML = '<div class="empty">No classes scheduled.</div>';
      return;
    }
    list.innerHTML = schedule.map(ev => {
      const zoomBtn = ev.zoom_url && ev.zoom_url.startsWith('https://')
        ? `<a class="zoom-btn" href="${esc(ev.zoom_url)}" target="_blank" rel="noopener">Join Zoom</a>`
        : "";
      const removeBtn = ev.manual
        ? `<button class="hide-btn" onclick="removeManualEntry(event,'${esc(ev.manual_id)}')">×</button>`
        : "";
      const badge = ev.manual ? `<div class="manual-badge">MANUAL</div>` : "";
      return `
        <div class="card${ev.manual ? ' manual' : ''}">
          <div class="card-time">${esc(ev.time)}</div>
          <div class="card-body">
            <div class="card-title">${esc(ev.title)}</div>
            ${badge}
          </div>
          ${zoomBtn}
          ${removeBtn}
        </div>
      `;
    }).join("");
  }

  function renderAssignments(assignments, checking = false) {
    const list = document.getElementById("assignments-list");
    if (!assignments.length) {
      list.innerHTML = '<div class="empty">No assignments this week.</div>';
      return;
    }
    list.innerHTML = assignments.map(a => {
      const due = a.due_at ? `Due ${formatDueDate(a.due_at)}` : "";
      const statusHtml = checking
        ? `<div class="status" style="color:#bdc3c7">Checking…</div>`
        : `<div class="status not-submitted">Not submitted</div><div class="card-sub-due card-sub">${due}</div>`;

      return `
        <div class="card${checking ? ' checking' : ' not-submitted'}" data-due="${esc(a.due_at || '')}">
          <span class="status-icon${checking ? '' : ' warn'}">${checking ? '' : '!'}</span>
          <div class="card-body">
            <div class="card-title">${esc(a.title)}</div>
            <div class="card-sub">${esc(a.course_name)}</div>
          </div>
          <div class="card-right">${statusHtml}</div>
          <button class="hide-btn"
                  data-aid="${esc(a.id)}"
                  data-cid="${esc(a.course_id)}"
                  data-cname="${esc(a.course_name)}"
                  onclick="openHideOpts(event, this)">×</button>
          <div class="hide-opts" id="ho-${esc(a.id)}">
            <button class="hide-opts-btn" onclick="doIgnore(event, this, 'assignment')">Hide assignment</button>
            <button class="hide-opts-btn" data-role="course-btn" onclick="doIgnore(event, this, 'course')">Hide course</button>
            <button class="hide-opts-cancel" onclick="closeAllHideOpts(event)">Cancel</button>
          </div>
        </div>
      `;
    }).join("");
  }

  const TASK_TAGS = { due: "Due Today", start: "Start", continue: "Continue", reading: "Reading", reminder: "Reminder", other: "" };

  function renderTasks(taskBlocks, homepageAvailable) {
    const note = document.getElementById("homepage-note");
    const list = document.getElementById("tasks-list");
    if (!homepageAvailable) {
      note.style.display = "block";
      list.innerHTML = "";
      return;
    }
    note.style.display = "none";
    if (!taskBlocks.length) {
      list.innerHTML = '<div class="empty">No tasks today.</div>';
      return;
    }
    list.innerHTML = taskBlocks.map(block => {
      const rows = block.items.map(it => {
        let statusClass = "info", statusChar = "•";
        if (it.submittable) {
          if (it.submitted || it.graded) { statusClass = "done"; statusChar = "✓"; }
          else { statusClass = "todo"; statusChar = "!"; }
        }
        const tag = TASK_TAGS[it.type_label] || "";
        const tagHtml = tag ? `<span class="task-tag">${esc(tag)}</span>` : "";
        const titleHtml = it.url
          ? `<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a>`
          : esc(it.title);
        return `
          <div class="task-row${it.optional ? ' optional' : ''}">
            <span class="task-status ${statusClass}">${statusChar}</span>
            <div class="t-title">${titleHtml}</div>
            ${tagHtml}
          </div>`;
      }).join("");
      return `<div class="task-course">${esc(block.course_name)}</div>${rows}`;
    }).join("");
  }

  function renderMissing(missing) {
    const section = document.getElementById("missing-section");
    const list = document.getElementById("missing-list");
    if (!missing.length) {
      section.style.display = "none";
      return;
    }
    section.style.display = "block";
    list.innerHTML = missing.map(a => `
      <div class="card missing">
        <span class="status-icon missing">✗</span>
        <div class="card-body">
          <div class="card-title">${esc(a.title)}</div>
          <div class="card-sub">${esc(a.course_name)}</div>
        </div>
        <div class="card-right">
          <div class="status missing">Was due ${formatDueDate(a.due_at)}</div>
        </div>
        <button class="hide-btn"
                data-aid="${esc(a.id)}"
                data-cid="${esc(a.course_id)}"
                data-cname="${esc(a.course_name)}"
                onclick="openHideOpts(event, this)">×</button>
        <div class="hide-opts" id="ho-${esc(a.id)}">
          <button class="hide-opts-btn" onclick="doIgnore(event, this, 'assignment')">Hide assignment</button>
          <button class="hide-opts-btn" data-role="course-btn" onclick="doIgnore(event, this, 'course')">Hide course</button>
          <button class="hide-opts-cancel" onclick="closeAllHideOpts(event)">Cancel</button>
        </div>
      </div>
    `).join("");
  }

  function openHideOpts(event, btn) {
    event.stopPropagation();
    closeAllHideOpts(event);
    const opts = document.getElementById(`ho-${btn.dataset.aid}`);
    opts.querySelector('[data-role="course-btn"]').textContent = `Hide all ${btn.dataset.cname}`;
    opts.classList.add('open');
  }

  function doIgnore(event, btn, type) {
    event.stopPropagation();
    const card = btn.closest('.card');
    const hidBtn = card.querySelector('.hide-btn');
    const id = type === 'assignment' ? hidBtn.dataset.aid : hidBtn.dataset.cid;
    ignoreItem(type, id);
  }

  function closeAllHideOpts(event) {
    if (event) event.stopPropagation();
    document.querySelectorAll('.hide-opts.open').forEach(el => el.classList.remove('open'));
  }

  async function ignoreItem(type, id) {
    fetch('/api/ignore', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({type, id})
    });
    if (type === 'assignment') {
      document.querySelectorAll(`.hide-btn[data-aid="${CSS.escape(id)}"]`).forEach(btn => {
        btn.closest('.card').remove();
      });
    } else {
      document.querySelectorAll(`.hide-btn[data-cid="${CSS.escape(id)}"]`).forEach(btn => {
        btn.closest('.card').remove();
      });
    }
  }

  document.addEventListener('click', closeAllHideOpts);

  function clearDay() {
    document.getElementById("schedule-list").innerHTML = "";
    document.getElementById("assignments-list").innerHTML = "";
    document.getElementById("tasks-list").innerHTML = "";
    document.getElementById("homepage-note").style.display = "none";
    document.getElementById("missing-list").innerHTML = "";
    document.getElementById("missing-section").style.display = "none";
  }

  async function loadDay(dateStr) {
    hideError();
    clearDay();
    if (currentController) currentController.abort();
    currentController = new AbortController();
    const signal = currentController.signal;
    document.getElementById("loading").style.display = "block";
    document.getElementById("current-date").textContent = formatDisplayDate(dateStr);

    try {
      const tzoffset = new Date().getTimezoneOffset();
      const [dayRes, missingRes] = await Promise.all([
        fetch(`/api/day?date=${dateStr}&tzoffset=${tzoffset}`, { signal }),
        fetch("/api/missing", { signal })
      ]);

      const day = await dayRes.json();
      const missingData = await missingRes.json();

      if (day.error) { showError(`Canvas error: ${day.error}`); return; }

      renderSchedule(day.schedule || []);
      renderTasks(day.tasks || [], day.homepage_available !== false);
      renderAssignments(day.assignments || [], true);
      if (missingData.error) {
        showError(`Missing assignments unavailable: ${missingData.error}`);
      }
      renderMissing(missingData.missing || []);
      document.getElementById("loading").style.display = "none";

      currentTodayStartUtc = day.today_start_utc || '';
      const assignments = day.assignments || [];
      if (assignments.length) {
        const subRes = await fetch('/api/submissions', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(assignments.map(a => ({id: a.id, course_id: a.course_id}))),
          signal,
        });
        const subs = await subRes.json();
        if (!Array.isArray(subs)) return;
        applySubmissions(subs, currentTodayStartUtc);
      }
      startAutoRefresh();
    } catch (err) {
      if (err.name === 'AbortError') return;
      showError("Could not connect to the local server. Is app.py running?");
    } finally {
      document.getElementById("loading").style.display = "none";
    }
  }

  function applySubmissions(subs, todayStartUtc) {
    for (const s of subs) {
      const card = document.querySelector(`.hide-btn[data-aid="${CSS.escape(s.id)}"]`)?.closest('.card');
      if (!card) continue;

      // submitted past-due assignments: remove silently (already done, not relevant to today)
      if (s.submitted && todayStartUtc && (card.dataset.due || '') < todayStartUtc) {
        card.remove();
        continue;
      }

      const right = card.querySelector('.card-right');
      const icon = card.querySelector('.status-icon');
      if (!right || !icon) continue;

      card.classList.remove('not-submitted', 'checking');

      if (s.submitted && s.graded) {
        icon.className = 'status-icon ok';
        icon.textContent = '✓';
        right.innerHTML = `<div class="grade">${esc(s.grade)}</div><div class="status submitted">Graded</div>`;
      } else if (s.submitted) {
        icon.className = 'status-icon ok';
        icon.textContent = '✓';
        right.innerHTML = `<div class="status pending">Pending grade</div>`;
      } else {
        icon.className = 'status-icon warn';
        icon.textContent = '!';
        card.classList.add('not-submitted');
        const dueEl = card.querySelector('.card-sub-due');
        right.innerHTML = `<div class="status not-submitted">Not submitted</div>${dueEl ? dueEl.outerHTML : ''}`;
      }

      const comments = (s.comments || []).map(c => `<div class="card-comment">"${esc(c)}"</div>`).join('');
      const body = card.querySelector('.card-body');
      body.querySelectorAll('.card-comment').forEach(el => el.remove());
      if (comments) body.insertAdjacentHTML('beforeend', comments);
    }
  }

  let currentController = null;
  let currentDate = toDateStr(new Date());
  let currentTodayStartUtc = '';
  let refreshTimer = null;
  const REFRESH_INTERVAL = 5 * 60 * 1000;

  function stopAutoRefresh() {
    if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
  }

  function startAutoRefresh() {
    stopAutoRefresh();
    refreshTimer = setInterval(autoRefresh, REFRESH_INTERVAL);
  }

  async function autoRefresh() {
    const btns = [...document.querySelectorAll('#assignments-list .hide-btn')];
    if (!btns.length) return;
    const items = btns.map(b => ({ id: b.dataset.aid, course_id: b.dataset.cid }));
    try {
      const [subRes, missingRes] = await Promise.all([
        fetch('/api/submissions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(items),
        }),
        fetch('/api/missing'),
      ]);
      const subs = await subRes.json();
      const missingData = await missingRes.json();
      if (Array.isArray(subs)) applySubmissions(subs, currentTodayStartUtc);
      if (missingData.missing) renderMissing(missingData.missing);
      const t = new Date();
      document.getElementById('last-updated').textContent =
        ` · ${t.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })}`;
    } catch (_) {}
  }

  async function openAddClassModal() {
    document.getElementById("add-class-modal").style.display = "flex";
    document.getElementById("add-class-form").reset();
    const res = await fetch("/api/schedule-config");
    const entries = await res.json();
    const listEl = document.getElementById("manual-entry-list");
    if (!entries.length) { listEl.style.display = "none"; return; }
    listEl.style.display = "block";
    listEl.innerHTML = "<strong style='font-size:12px;color:#7f8c8d'>Existing classes</strong>" +
      entries.map(e => `
        <div class="manual-entry-row" id="mer-${esc(e.id)}">
          <div class="manual-entry-info">
            <div class="manual-entry-name">${esc(e.title)}</div>
            <div class="manual-entry-meta">${esc(e.time)} · ${esc((e.days||[]).join(", "))}</div>
          </div>
          <button class="remove-entry-btn" onclick="removeManualEntry(event,'${esc(e.id)}')">×</button>
        </div>
      `).join("");
  }

  function closeAddClassModal(event) {
    if (event && event.target !== document.getElementById("add-class-modal")) return;
    document.getElementById("add-class-modal").style.display = "none";
  }

  async function submitAddClass(event) {
    event.preventDefault();
    const days = [...document.querySelectorAll('#add-class-form input[name=day]:checked')].map(el => el.value);
    if (!days.length) { alert("Select at least one day."); return; }
    const body = {
      title: document.getElementById("ac-title").value.trim(),
      time: document.getElementById("ac-time").value.trim(),
      days,
      zoom_url: document.getElementById("ac-url").value.trim() || null,
    };
    await fetch("/api/schedule-config", {
      method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body),
    });
    document.getElementById("add-class-modal").style.display = "none";
    loadDay(currentDate);
  }

  async function removeManualEntry(event, id) {
    event.stopPropagation();
    await fetch(`/api/schedule-config/${encodeURIComponent(id)}`, { method: "DELETE" });
    document.getElementById(`mer-${id}`)?.remove();
    document.querySelectorAll(`.card.manual`).forEach(card => {
      const btn = card.querySelector(".hide-btn");
      if (btn && btn.getAttribute("onclick")?.includes(id)) card.remove();
    });
    const list = document.getElementById("manual-entry-list");
    if (list && !list.querySelector(".manual-entry-row")) list.style.display = "none";
  }

  document.getElementById("prev-day").addEventListener("click", () => {
    stopAutoRefresh();
    clearDay();
    currentDate = shiftDate(currentDate, -1);
    loadDay(currentDate);
  });

  document.getElementById("next-day").addEventListener("click", () => {
    stopAutoRefresh();
    clearDay();
    currentDate = shiftDate(currentDate, 1);
    loadDay(currentDate);
  });

  document.getElementById("today-btn").addEventListener("click", () => {
    stopAutoRefresh();
    clearDay();
    currentDate = toDateStr(new Date());
    loadDay(currentDate);
  });

  loadDay(currentDate);
</script>

</body>
</html>
